<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0B1F3A" />
  <title>WunaGo — Backoffice</title>
  <link rel="icon" href="icons/wouri-icon-192.png" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <style>
    @font-face { font-family: "Manrope"; src: url("fonts/Manrope-200-800.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
    @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-500.woff2") format("woff2"); font-weight: 400 600; font-display: swap; }
    :root { --yellow: #1FD1B2; --ink: #0B1F3A; --bg: #F5F8FA; --hair: rgba(11,31,58,.08); --mono: "IBM Plex Mono", ui-monospace, monospace; --sans: "Manrope", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .mono { font-family: var(--mono); }
    .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: rgba(11,31,58,.55); }
    .btn { min-height: 44px; border: 0; border-radius: 17px; padding: 0 18px; font-weight: 700; font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-ink { background: var(--ink); color: #fff; }
    .btn-yellow { background: var(--ink); color: #fff; }
    .btn-ghost { background: rgba(11,31,58,.06); }
    .btn-sm { min-height: 36px; border-radius: 12px; padding: 0 12px; font-size: 12px; }
    .card { background: #fff; border: 1px solid var(--hair); border-radius: 16px; }
    .pill { display: inline-flex; align-items: center; border-radius: 99px; padding: 3px 9px; font-family: var(--mono); font-weight: 600; font-size: 10px; background: rgba(11,31,58,.07); white-space: nowrap; }
    .pill.y { background: #DDF8F2; } .pill.k { background: var(--ink); color: var(--yellow); } .pill.r { background: #fde2dd; color: #8a1c0c; }
    input.f, select.f, textarea.f { width: 100%; min-height: 44px; border: 1px solid var(--hair); border-radius: 12px; background: #fff; padding: 0 12px; font-weight: 600; }
    textarea.f { padding: 10px 12px; min-height: 80px; resize: vertical; font-weight: 500; }
    /* connexion */
    .login { min-height: 100%; display: flex; align-items: center; justify-content: center; background: var(--ink); padding: 24px; }
    .login .card { width: 100%; max-width: 380px; padding: 26px; display: flex; flex-direction: column; gap: 14px; border: 0; }
    /* structure */
    .shell { display: grid; grid-template-columns: 230px 1fr; height: 100%; }
    nav.side { background: var(--ink); color: #fff; padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 19px; letter-spacing: -.5px; padding: 0 8px 18px; }
    .brand small { font-family: var(--mono); font-weight: 500; font-size: 9.5px; color: var(--yellow); letter-spacing: .08em; }
    nav.side button { min-height: 44px; border: 0; border-radius: 12px; background: transparent; color: rgba(255,255,255,.72); text-align: left; padding: 0 12px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; }
    nav.side button.on { background: var(--yellow); color: var(--ink); }
    nav.side .count { font-family: var(--mono); font-size: 10.5px; min-width: 22px; height: 20px; border-radius: 99px; background: rgba(255,255,255,.14); display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
    nav.side button.on .count { background: var(--ink); color: var(--yellow); }
    nav.side .foot { margin-top: auto; font-size: 12px; color: rgba(255,255,255,.6); padding: 0 8px; display: flex; flex-direction: column; gap: 8px; }
    main { overflow: auto; padding: 26px 30px 40px; }
    h1 { margin: 0 0 18px; font-weight: 800; font-size: 24px; letter-spacing: -.7px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
    .kpi { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .kpi b { font-size: 26px; letter-spacing: -.8px; }
    .kpi.dark { background: var(--ink); color: #fff; border: 0; } .kpi.dark b { color: var(--yellow); } .kpi.dark .lbl { color: rgba(255,255,255,.6); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--hair); }
    td { padding: 11px 12px; border-bottom: 1px solid var(--hair); vertical-align: top; font-size: 13px; }
    tr:last-child td { border-bottom: 0; }
    td.mono { white-space: nowrap; }
    tr.click { cursor: pointer; } tr.click:hover td { background: rgba(31,209,178,.12); }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    .tools input.f { max-width: 280px; }
    .chip { min-height: 36px; border-radius: 99px; border: 1px solid var(--hair); background: #fff; padding: 0 13px; font-weight: 700; font-size: 12px; }
    .chip.on { background: var(--ink); color: var(--yellow); border-color: var(--ink); }
    .split { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 14px; height: calc(100vh - 120px); }
    .list { overflow: auto; } .list button.row { width: 100%; border: 0; border-bottom: 1px solid var(--hair); background: transparent; text-align: left; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; min-height: 60px; }
    .list button.row.on { background: rgba(31,209,178,.2); }
    .thread { display: flex; flex-direction: column; overflow: hidden; }
    .msgs { flex: 1; overflow: auto; background: #EAF0F4; padding: 14px; display: flex; flex-direction: column; gap: 7px; }
    .bubble { max-width: 70%; background: #fff; border: 1px solid var(--hair); border-radius: 16px 16px 16px 5px; padding: 8px 11px 6px; line-height: 1.4; align-self: flex-start; }
    .bubble.me { background: #DDF8F2; border-color: transparent; border-radius: 16px 16px 5px 16px; align-self: flex-end; }
    .bubble img { max-width: 240px; border-radius: 10px; display: block; }
    .compose { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--hair); }
    #couriers-map { height: 380px; border-radius: 16px; overflow: hidden; margin-bottom: 14px; border: 1px solid var(--hair); }
    .drawer-bg { position: fixed; inset: 0; background: rgba(11,31,58,.35); z-index: 1000; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--bg); z-index: 1001; overflow: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: -10px 0 40px rgba(0,0,0,.15); }
    .row2 { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--hair); font-size: 13px; }
    .row2:last-child { border-bottom: 0; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 700; z-index: 2000; }
    .empty { padding: 26px; text-align: center; color: rgba(11,31,58,.55); }
    h2.sec { margin: 26px 0 12px; font-weight: 800; font-size: 17px; letter-spacing: -.4px; }
    h2.sec:first-of-type { margin-top: 4px; }
    .kpi-sub { font-size: 11.5px; color: rgba(11,31,58,.6); line-height: 1.35; }
    .kpi.dark .kpi-sub { color: rgba(255,255,255,.7); } .kpi.dark .pill.k { background: var(--yellow); color: var(--ink); } .kpi .pill { align-self: flex-start; }
    .kpi-btn { text-align: left; font: inherit; color: inherit; cursor: pointer; }
    .kpi-btn:hover { border-color: var(--ink); } .kpi-btn.warn { background: #DDF8F2; border-color: var(--yellow); }
    .kpi-go { font-family: var(--mono); font-size: 10px; color: rgba(11,31,58,.5); }
    .tools .fx-dates { display: inline-flex; align-items: center; gap: 6px; }
    .tools .fx-dates input.f { width: 150px; min-height: 36px; border-radius: 10px; font-size: 12px; }
    .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
    .grid1 { margin-bottom: 14px; }
    .rep { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .rep h2 { margin: 0; font-weight: 800; font-size: 14.5px; }
    .rep .empty { padding: 14px; }
    .note { margin: 0; font-size: 11.5px; color: rgba(11,31,58,.6); line-height: 1.45; }
    .rt td, .rt th { padding: 8px 8px; font-size: 12.5px; } .rt td.mono, .rt th { white-space: nowrap; }
    .hbars { display: flex; flex-direction: column; gap: 7px; }
    .hb { display: grid; grid-template-columns: minmax(90px, 140px) 1fr auto; gap: 10px; align-items: center; font-size: 12.5px; }
    .hb-l { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hb-t { height: 12px; background: rgba(11,31,58,.05); border-radius: 4px; overflow: hidden; }
    .hb-b { display: block; height: 100%; background: var(--ink); border-radius: 0 4px 4px 0; }
    .hb-v { font-size: 11.5px; min-width: 80px; text-align: right; }
    .cols { display: flex; align-items: flex-end; gap: 3px; height: 170px; padding-top: 10px; border-bottom: 1px solid rgba(11,31,58,.15); }
    .col-w { flex: 1 1 0; max-width: 44px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; position: relative; min-width: 0; outline: none; }
    .col-b { background: var(--ink); border-radius: 4px 4px 0 0; min-height: 0; }
    .col-w:hover .col-b, .col-w:focus .col-b { background: var(--yellow); box-shadow: inset 0 0 0 2px var(--ink); }
    .col-x { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 9px; color: rgba(11,31,58,.55); white-space: nowrap; }
    .col-tip { display: none; position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 7px 9px; border-radius: 9px; font-size: 11px; line-height: 1.4; white-space: nowrap; z-index: 5; pointer-events: none; }
    .col-w:hover .col-tip, .col-w:focus .col-tip { display: block; }
    .rep .cols { margin-bottom: 18px; }
    .pnav { display: inline-flex; align-items: center; gap: 6px; }
    .pnav input.f, .tools .sel { width: auto; min-height: 36px; border-radius: 10px; font-size: 12px; }
    .plabel { font-size: 15px; margin-right: 6px; }
    .sumbar { display: flex; flex-wrap: wrap; gap: 8px 22px; background: var(--ink); color: #fff; border-radius: 16px; padding: 13px 16px; margin-bottom: 12px; font-size: 13px; }
    .sumbar b { color: var(--yellow); }
    tr.dayrow td { background: rgba(31,209,178,.18); padding: 9px 12px; }
    tr.dayrow td b { margin-right: 12px; } tr.dayrow td .mono { font-size: 11px; color: rgba(11,31,58,.65); }
    button[disabled] { opacity: .45; cursor: not-allowed; }
    .late { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: #fde2dd; border: 1.5px solid #e9a597; color: #5a1206; border-radius: 16px; padding: 12px 16px; margin-bottom: 16px; }
    .late b { flex: 1; min-width: 240px; }
    .balance { flex-direction: row; display: flex; align-items: center; gap: 16px; padding: 16px 18px; margin-bottom: 14px; flex-wrap: wrap; }
    .balance > div { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 260px; }
    .balance b { font-size: 20px; letter-spacing: -.4px; } .balance.owe { background: #DDF8F2; border-color: var(--yellow); }
    @media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      nav.side { flex-direction: row; overflow-x: auto; padding: 10px; gap: 6px; }
      nav.side .brand, nav.side .foot { display: none; }
      nav.side button { flex: none; }
      main { padding: 18px 14px 30px; }
      .split { grid-template-columns: 1fr; height: auto; }
      .thread { height: 70vh; }
    }
  </style>
</head>
<body>
  <div id="admin" style="height:100%"></div>
  <script src="vendor/leaflet/leaflet.js" defer></script>
  <script type="module" src="pricing.mjs"></script>
  <script src="api.js" defer></script>
  <script src="admin.js" defer></script>
</body>
</html>

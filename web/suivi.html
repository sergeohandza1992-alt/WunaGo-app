<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#FFD700" />
  <title>Suivi de livraison — WunaGo</title>
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <style>
    @font-face { font-family: "Manrope"; src: url("fonts/Manrope-200-800.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
    @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-500.woff2") format("woff2"); font-weight: 400 600; font-display: swap; }
    :root { --y: #FFD700; --k: #101010; --bg: #FBFAF7; --hair: rgba(16,16,16,.08); --mono: "IBM Plex Mono", ui-monospace, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--k); font-family: "Manrope", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--y); padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 16px; display: flex; align-items: center; gap: 10px; }
    header b { font-weight: 800; font-size: 20px; letter-spacing: -.5px; }
    header span { margin-left: auto; font-family: var(--mono); font-size: 11px; }
    #map { height: 260px; background: #eceae4; }
    main { padding: 18px 20px 30px; display: flex; flex-direction: column; gap: 14px; }
    h1 { margin: 0; font-weight: 800; font-size: 22px; letter-spacing: -.6px; }
    .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: rgba(16,16,16,.55); }
    .card { background: #fff; border: 1px solid var(--hair); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .tl { display: flex; flex-direction: column; }
    .st { display: flex; gap: 12px; align-items: flex-start; }
    .st .dot { width: 13px; height: 13px; border-radius: 99px; border: 2.5px solid rgba(16,16,16,.18); background: #fff; flex: none; margin-top: 2px; }
    .st .bar { width: 2px; height: 18px; background: rgba(16,16,16,.13); margin: 2px 0 2px 5.5px; }
    .st.done .dot { background: var(--k); border-color: var(--k); } .st.on .dot { background: var(--y); border-color: var(--k); }
    .st span { font-weight: 700; font-size: 13.5px; color: rgba(16,16,16,.4); } .st.done span, .st.on span { color: var(--k); }
    .row { display: flex; align-items: center; gap: 11px; }
    .av { width: 44px; height: 44px; border-radius: 99px; background: var(--y); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex: none; }
    .btn { min-height: 48px; border-radius: 17px; border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 700; font-size: 14px; text-decoration: none; padding: 0 18px; }
    .ink { background: var(--k); color: #fff; } .yel { background: var(--y); color: var(--k); } .out { background: #fff; color: var(--k); border: 1.5px solid rgba(16,16,16,.12); }
    .muted { font-size: 12.5px; line-height: 1.5; color: rgba(16,16,16,.7); margin: 0; }
    .big { font-weight: 800; font-size: 16px; }
    .err { text-align: center; padding: 60px 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header><svg width="22" height="28" viewBox="0 0 60 76" aria-hidden="true"><path d="M30 4C14.5 4 4 15.4 4 29.5C4 47 30 72 30 72C30 72 56 47 56 29.5C56 15.4 45.5 4 30 4Z" fill="#101010"/><rect x="20" y="20" width="20" height="20" rx="3" fill="#FFD700"/></svg><b>WunaGo</b><span id="code"></span></header>
    <div id="map" aria-label="Carte de la livraison"></div>
    <main id="main"><p class="muted">Chargement du suivi…</p></main>
  </div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script>
  (function () {
    var token = new URLSearchParams(location.search).get("c") || "";
    var SVC = { parcel: "colis", laundry: "linge", errand: "courses", ride: "course" };
    var TL = {
      parcel: ["Commande reçue", "Colis récupéré", "En route vers vous", "Livré"],
      laundry: ["Commande reçue", "Linge collecté", "En route vers vous", "Livré"],
      errand: ["Commande reçue", "Achats en cours", "En route vers vous", "Livré"],
      ride: ["Course réservée", "Chauffeur en route", "En trajet", "Arrivé"]
    };
    var VEH = { bike: "Moto", tricycle: "Tricycle", van: "Camionnette", car: "Voiture" };
    var main = document.getElementById("main"), map = null, layers = null, courier = null, fitted = false;
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function pin(bg, size, square) {
      return L.divIcon({ className: "", iconSize: [size, size], iconAnchor: [size / 2, size / 2],
        html: '<div style="width:' + size + 'px;height:' + size + 'px;background:' + bg + ';border:3px solid #101010;border-radius:' + (square ? "3px" : "99px") + '"></div>' });
    }
    function drawMap(d) {
      if (!window.L) return;
      if (!map) {
        map = L.map("map", { zoomControl: false, attributionControl: true }).setView([4.05, 9.72], 12);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
        layers = L.layerGroup().addTo(map);
      }
      if (!fitted) {
        layers.clearLayers(); var pts = [];
        if (d.pickupGeo) { L.marker([d.pickupGeo.lat, d.pickupGeo.lng], { icon: pin("#FFD700", 16) }).addTo(layers); pts.push([d.pickupGeo.lat, d.pickupGeo.lng]); }
        if (d.dropoffGeo) { L.marker([d.dropoffGeo.lat, d.dropoffGeo.lng], { icon: pin("#101010", 15, true) }).addTo(layers); pts.push([d.dropoffGeo.lat, d.dropoffGeo.lng]); }
        if (pts.length === 2) L.polyline(pts, { color: "#101010", weight: 4, dashArray: "1 8", lineCap: "round" }).addTo(layers);
        if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [40, 40], maxZoom: 16 });
        fitted = true;
      }
      var p = d.courier && d.courier.pos;
      if (p) { if (!courier) courier = L.marker([p.lat, p.lng], { icon: pin("#FFD700", 26), zIndexOffset: 1000 }).addTo(map); else courier.setLatLng([p.lat, p.lng]); }
    }
    function show(d) {
      document.getElementById("code").textContent = d.code;
      var steps = TL[d.service] || TL.parcel, done = d.status === "delivered", cancelled = d.status === "cancelled";
      var title = cancelled ? "Livraison annulée" : done ? "Votre " + SVC[d.service] + " est arrivé" + (d.service === "errand" ? "es" : "") + " !"
        : d.arrivedAt ? (d.service === "ride" ? "Votre chauffeur est arrivé" : "Votre livreur est arrivé !") : steps[Math.min(d.stage, 3)];
      var tl = steps.map(function (s, i) {
        var cls = done || i < d.stage ? "done" : i === d.stage && !cancelled ? "on" : "";
        return '<div class="st ' + cls + '"><div><div class="dot"></div>' + (i < 3 ? '<div class="bar"></div>' : '') + '</div><span>' + esc(s) + '</span></div>';
      }).join("");
      var c = d.courier, h = d.hints || {};
      main.innerHTML =
        '<div><div class="lbl">' + (d.recipient && d.recipient.name ? "Pour " + esc(d.recipient.name) : "Suivi de livraison") + '</div><h1>' + esc(title) + '</h1></div>' +
        (c ? '<div class="card"><div class="row"><div class="av">' + esc(c.name.slice(0, 1).toUpperCase()) + '</div><div style="flex:1"><div class="lbl">Votre livreur</div><div class="big">' + esc(c.name) + '</div>' +
          '<div class="lbl" style="text-transform:none">' + esc(VEH[c.vehicle] || "") + (c.plate ? " · " + esc(c.plate) : "") + '</div></div>' +
          (c.phone ? '<a class="btn ink" href="tel:+237' + esc(c.phone) + '">Appeler</a>' : '') + '</div></div>'
          : !done && !cancelled ? '<div class="card"><p class="muted">Un livreur WunaGo va prendre en charge la livraison dans quelques minutes.</p></div>' : '') +
        '<div class="card"><div class="tl">' + tl + '</div></div>' +
        '<div class="card"><div><div class="lbl">Départ</div><div style="font-weight:700">' + esc(d.pickup) + '</div>' + (h.pickup ? '<p class="muted">Repère : ' + esc(h.pickup) + '</p>' : '') + '</div>' +
        (d.dropoff !== d.pickup ? '<div><div class="lbl">Arrivée</div><div style="font-weight:700">' + esc(d.dropoff) + '</div>' + (h.dropoff ? '<p class="muted">Repère : ' + esc(h.dropoff) + '</p>' : '') + '</div>' : '') + '</div>' +
        (d.canSharePosition ? '<div class="card"><div class="big">' + (d.positionShared ? "Position exacte reçue ✓" : "Le livreur ne connaît pas l'endroit ?") + '</div>' +
          '<p class="muted">' + (d.positionShared ? "Le livreur ira directement au point envoyé. Vous pouvez le renvoyer si vous avez bougé." : "Si vous êtes déjà à l'adresse de livraison, envoyez votre position exacte : le livreur arrivera directement à vous.") + '</p>' +
          '<button class="btn ' + (d.positionShared ? "out" : "ink") + '" id="share-pos">📍 ' + (d.positionShared ? "Renvoyer ma position" : "Envoyer ma position exacte") + '</button><p class="muted" id="pos-msg" role="status"></p></div>' : '') +
        (!done && !cancelled ? '<p class="muted">À l\'arrivée, donnez au livreur le <b>code de remise</b> reçu dans le message.</p>' : '') +
        '<a class="btn yel" href="/">Commander avec WunaGo</a>';
      drawMap(d);
      var sb = document.getElementById("share-pos");
      if (sb) sb.onclick = sharePos;
      return !done && !cancelled;
    }
    function sharePos() {
      var msg = document.getElementById("pos-msg"), btn = document.getElementById("share-pos");
      if (!navigator.geolocation) { msg.textContent = "Votre téléphone ne permet pas de partager la position."; return; }
      btn.disabled = true; msg.textContent = "Recherche de votre position…";
      navigator.geolocation.getCurrentPosition(function (p) {
        fetch("/api/suivi/" + encodeURIComponent(token) + "/position", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }) })
          .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "Envoi impossible."); return j; }); })
          .then(function () { fitted = false; load(); })
          .catch(function (e) { btn.disabled = false; msg.textContent = e.message; });
      }, function () { btn.disabled = false; msg.textContent = "Autorisez la localisation dans votre navigateur, puis réessayez."; }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    }
    var timer = null;
    function load() {
      clearTimeout(timer);
      fetch("/api/suivi/" + encodeURIComponent(token), { cache: "no-store" }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (x) {
          if (!x.ok) throw new Error(x.j.error || "Lien invalide.");
          if (show(x.j)) timer = setTimeout(load, 15000);
        }).catch(function (e) {
          main.innerHTML = '<div class="err"><h1>Lien de suivi introuvable</h1><p class="muted">' + esc(e.message) + '</p><p><a class="btn yel" href="/">Ouvrir WunaGo</a></p></div>';
        });
    }
    load();
  })();
  </script>
</body>
</html>
